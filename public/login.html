<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Satz</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --hover: #f5f5f5;
        --ring: rgb(161 161 161 / 0.5);
        --destructive: #e7000b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a1a1a1;
          --border: rgb(255 255 255 / 0.15);
          --hover: rgb(255 255 255 / 0.06);
          --ring: rgb(115 115 115 / 0.5);
          --destructive: #ff6467;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: -0.01em;
      }
      main {
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: -8vh;
      }
      h1 {
        margin: 0;
        font-size: 40px;
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin: 8px 0 0;
        font-size: 15px;
        color: var(--muted);
      }
      a.button {
        margin-top: 40px;
        width: 100%;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--fg);
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        outline: none;
        transition:
          transform 160ms cubic-bezier(0.23, 1, 0.32, 1),
          background-color 150ms ease;
      }
      a.button:active {
        transform: scale(0.97);
      }
      a.button:focus-visible {
        box-shadow: 0 0 0 3px var(--ring);
      }
      @media (hover: hover) and (pointer: fine) {
        a.button:hover {
          background: var(--hover);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        a.button:active {
          transform: none;
        }
      }
      #error {
        min-height: 22px;
        margin-top: 16px;
        font-size: 13px;
        color: var(--destructive);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Satz</h1>
      <p>German sentences, one day at a time.</p>
      <a class="button" href="/api/auth/login">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Continue with Google
      </a>
      <div id="error" role="alert"></div>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
